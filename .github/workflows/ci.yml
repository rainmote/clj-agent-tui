name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Run tests
        run: clojure -M:test
      - name: Run lint
        run: clojure -M:lint
      - name: Public API smoke check
        run: clojure -M -e "(require '[clj-agent-tui.core :as tui]) (println :ok)"
      - name: Verify cljdoc config
        run: curl -fsSL https://raw.githubusercontent.com/cljdoc/cljdoc/master/script/verify-cljdoc-edn | bash -s doc/cljdoc.edn
      - name: Build jar
        run: clojure -T:build jar
